name: Build ImGui and Addons Libraries

on:
  workflow_call:

jobs:
  build-cimgui:
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      lib-name: cimgui
      repo: JunaMeinhold/cimgui
      # Pinned to the cimgui commit the checked-in binding (Generator/cimgui) was generated from
      # (Dear ImGui 1.92.9b docking); it only adds *_Construct exports the binding does not use.
      repo-tag: 576040c4bd36894113d1c1c6ae52c4ffd928cf28
      # Without CMAKE_BUILD_TYPE the single-config generators (Linux, macOS, Android) compile at -O0.
      # MSVC has no -O3; its multi-config Release build already uses /O2 /Ob2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DIMGUI_WCHAR32=ON -DIMGUI_FREETYPE=ON -DCIMGUI_VARGS0=1
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      use-vcpkg: true
      vcpkg-packages: freetype
      vcpkg-triplet-windows: "{arch}-windows-static"
      bin-name-linux: cimgui.so
      bin-name-linux-normalized: cimgui.so
      bin-name-windows: Release/cimgui.dll
      bin-name-windows-normalized: cimgui.dll
      bin-name-osx: cimgui.dylib
      bin-name-osx-normalized: cimgui.dylib
      bin-name-android: cimgui.so
      bin-name-android-normalized: cimgui.so
      android-api: 23

  build-cimplot:
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      lib-name: cimplot
      repo: JunaMeinhold/cimplot
      # Pinned to the cimplot commit Generator/cimplot was generated from.
      repo-tag: eb05976dca29780f7aa98d462b1e905784109a1f
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DIMGUI_WCHAR32=ON -DIMGUI_FREETYPE=ON -DCIMGUI_VARGS0=1
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      bin-name-linux: cimplot.so
      bin-name-linux-normalized: cimplot.so
      bin-name-windows: Release/cimplot.dll
      bin-name-windows-normalized: cimplot.dll
      bin-name-osx: cimplot.dylib
      bin-name-osx-normalized: cimplot.dylib
      bin-name-android: cimplot.so
      bin-name-android-normalized: cimplot.so
      android-api: 23
      pre-configure-steps: "bash scripts/setup_addon_build.sh"
      checkout-self: true

  build-cimnodes:
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      lib-name: cimnodes
      repo: JunaMeinhold/cimnodes
      # Pinned to the cimnodes commit Generator/cimnodes was generated from.
      repo-tag: 9544ec8b3d20aa8280d8802cfe2c6dd08b49e61d
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DIMGUI_WCHAR32=ON -DIMGUI_FREETYPE=ON -DCIMGUI_VARGS0=1
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      bin-name-linux: cimnodes.so
      bin-name-linux-normalized: cimnodes.so
      bin-name-windows: Release/cimnodes.dll
      bin-name-windows-normalized: cimnodes.dll
      bin-name-osx: cimnodes.dylib
      bin-name-osx-normalized: cimnodes.dylib
      bin-name-android: cimnodes.so
      bin-name-android-normalized: cimnodes.so
      android-api: 23
      pre-configure-steps: "bash scripts/setup_addon_build.sh"
      checkout-self: true

  build-cimguizmo:
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      lib-name: cimguizmo
      repo: JunaMeinhold/cimguizmo
      # Pinned to the cimguizmo commit Generator/cimguizmo was generated from.
      repo-tag: 7a7dc6bfdd2d9d0e85186834671bfcd275cb9adc
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DIMGUI_WCHAR32=ON -DIMGUI_FREETYPE=ON -DCIMGUI_VARGS0=1
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      bin-name-linux: cimguizmo.so
      bin-name-linux-normalized: cimguizmo.so
      bin-name-windows: Release/cimguizmo.dll
      bin-name-windows-normalized: cimguizmo.dll
      bin-name-osx: cimguizmo.dylib
      bin-name-osx-normalized: cimguizmo.dylib
      bin-name-android: cimguizmo.so
      bin-name-android-normalized: cimguizmo.so
      android-api: 23
      pre-configure-steps: "bash scripts/setup_addon_build.sh"
      checkout-self: true

  build-cimplot3d:
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      lib-name: cimplot3d
      repo: JunaMeinhold/cimplot3d
      # Pinned to the cimplot3d commit the shipped natives were built from (ImPlot3D 0.4). Note that
      # Generator/cimplot3d still describes ImPlot3D 0.3 WIP (dc046a1).
      repo-tag: a6fb3a5ae461fd3af3a594a729b944b446571d1b
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DIMGUI_WCHAR32=ON -DIMGUI_FREETYPE=ON -DCIMGUI_VARGS0=1
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      bin-name-linux: cimplot3d.so
      bin-name-linux-normalized: cimplot3d.so
      bin-name-windows: Release/cimplot3d.dll
      bin-name-windows-normalized: cimplot3d.dll
      bin-name-osx: cimplot3d.dylib
      bin-name-osx-normalized: cimplot3d.dylib
      bin-name-android: cimplot3d.so
      bin-name-android-normalized: cimplot3d.so
      android-api: 23
      pre-configure-steps: "bash scripts/setup_addon_build.sh"
      checkout-self: true
