name: Publish NuGet Packages

# Publishes Hexa.NET.X as the Paradise.X packages on nuget.org. The version comes from the v* tag or
# the dispatch input; the csproj PackageVersion only applies to local packs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example v3.1.0 or 3.1.1-beta.1"
        required: true
        type: string

jobs:
  natives:
    uses: ./.github/workflows/natives.yml

  build:
    needs: natives
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      PROJECTS: >-
        Hexa.NET.ImGui
        Hexa.NET.ImGuizmo
        Hexa.NET.ImNodes
        Hexa.NET.ImPlot
        Hexa.NET.ImPlot3D

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Native libraries are not committed; natives.yml built them from the pinned sources.
      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: natives
          path: .

      - name: Verify every packed native pattern has files
        run: mkdir -p no-artifacts && python3 scripts/place_natives.py no-artifacts .

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a package version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          projects=($PROJECTS)
          # GeneratePackageOnBuild keeps dotnet pack from building, so build every TFM first,
          # without the extra package the build would otherwise write under bin/.
          for project in "${projects[@]}"; do
            dotnet build "$project/$project.csproj" -c Release \
              -p:GeneratePackageOnBuild=false \
              -p:ContinuousIntegrationBuild=true \
              -p:PackageVersion="$PACKAGE_VERSION"
            dotnet pack "$project/$project.csproj" -c Release -o nupkgs --no-build \
              -p:ContinuousIntegrationBuild=true \
              -p:PackageVersion="$PACKAGE_VERSION"
          done
          ls nupkgs
          count=$(ls nupkgs/Paradise.*."$PACKAGE_VERSION".nupkg | wc -l)
          if [[ "$count" -ne "${#projects[@]}" ]]; then
            echo "::error::Expected ${#projects[@]} packages, found $count"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*.nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC -> temp API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
