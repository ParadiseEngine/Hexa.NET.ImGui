name: Build ImGui Backends (Static)

on:
  workflow_call:

jobs:
  build-base:
    name: Build (Base)
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      lib-name: ImGuiImpl-static
      repo: HexaEngine/cimgui_impl
      # Pinned to the cimgui_impl commit the shipped backend natives were built from (imgui b48d1af, as in cimgui).
      repo-tag: d31eabc9f71904d6d52448ef1f618e761c3bbceb
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DBACKENDS_BASE_ONLY=ON -DIMGUI_WCHAR32=ON -DBUILD_SHARED_LIBS=OFF
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-windows: -DCMAKE_SYSTEM_VERSION=10.0.26100.0
      bin-name-osx: libImGuiImpl.a
      bin-name-linux: libImGuiImpl.a
      bin-name-android: libImGuiImpl.a
      bin-name-windows: Release/ImGuiImpl.lib
      bin-name-osx-normalized: ImGuiImpl.a
      bin-name-linux-normalized: ImGuiImpl.a
      bin-name-android-normalized: ImGuiImpl.a
      bin-name-windows-normalized: ImGuiImpl.lib
      linux-deps: "build-essential cmake libsdl2-dev libglfw3-dev libglu1-mesa-dev libvulkan-dev patchelf"
      macos-deps: "sdl2 glfw glew glm"
      use-vcpkg: true
      use-vcpkg-linux: false
      use-vcpkg-macos: false
      use-vcpkg-android: false
      vcpkg-packages-windows: "vulkan glslang"
      setup-vulkan: true
      setup-vulkan-linux: false
      setup-vulkan-windows: false
      pre-deps-steps: "bash scripts/downgrade_cmake.sh"
      checkout-self: true

  build-sdl2:
    name: Build (SDL2)
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      enable-android: false
      lib-name: ImGuiImplSDL2-static
      repo: HexaEngine/cimgui_impl
      # Pinned to the cimgui_impl commit the shipped backend natives were built from (imgui b48d1af, as in cimgui).
      repo-tag: d31eabc9f71904d6d52448ef1f618e761c3bbceb
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DBACKENDS_SDL2_ONLY=ON -DIMGUI_WCHAR32=ON -DBUILD_SHARED_LIBS=OFF
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-windows: -DCMAKE_SYSTEM_VERSION=10.0.26100.0
      bin-name-osx: libImGuiImplSDL2.a
      bin-name-linux: libImGuiImplSDL2.a
      bin-name-android: libImGuiImplSDL2.a
      bin-name-windows: Release/ImGuiImplSDL2.lib
      bin-name-osx-normalized: ImGuiImplSDL2.a
      bin-name-linux-normalized: ImGuiImplSDL2.a
      bin-name-android-normalized: ImGuiImplSDL2.a
      bin-name-windows-normalized: ImGuiImplSDL2.lib
      linux-deps: "build-essential cmake libsdl2-dev libglfw3-dev libglu1-mesa-dev libvulkan-dev patchelf"
      macos-deps: "sdl2 glfw glew glm"
      use-vcpkg: true
      use-vcpkg-linux: false
      vcpkg-packages: "sdl2"
      setup-vulkan: true
      setup-vulkan-linux: false
      setup-vulkan-windows: false
      pre-deps-steps: "bash scripts/downgrade_cmake.sh"
      checkout-self: true

  build-sdl3:
    name: Build (SDL3)
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      enable-android: false
      lib-name: ImGuiImplSDL3-static
      repo: HexaEngine/cimgui_impl
      # Pinned to the cimgui_impl commit the shipped backend natives were built from (imgui b48d1af, as in cimgui).
      repo-tag: d31eabc9f71904d6d52448ef1f618e761c3bbceb
      checkout-self: true
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DBACKENDS_SDL3_ONLY=ON -DIMGUI_WCHAR32=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_PREFIX_PATH="./SDL/install"
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-windows: -DCMAKE_SYSTEM_VERSION=10.0.26100.0
      bin-name-osx: libImGuiImplSDL3.a
      bin-name-linux: libImGuiImplSDL3.a
      bin-name-android: libImGuiImplSDL3.a
      bin-name-windows: Release/ImGuiImplSDL3.lib
      bin-name-osx-normalized: ImGuiImplSDL3.a
      bin-name-linux-normalized: ImGuiImplSDL3.a
      bin-name-android-normalized: ImGuiImplSDL3.a
      bin-name-windows-normalized: ImGuiImplSDL3.lib
      linux-deps: "build-essential cmake libsdl2-dev libglfw3-dev libglu1-mesa-dev libvulkan-dev patchelf libpulse-dev libaudio-dev libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxi-dev libxinerama-dev libxss-dev libwayland-dev libwayland-egl-backend-dev libdbus-1-dev libudev-dev libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dev libibus-1.0-dev fcitx-libs-dev libsamplerate0-dev ccache libjack-jackd2-dev libdrm-dev libpipewire-0.3-dev libdecor-0-dev qtwayland5 libxkbcommon-dev libsndio-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev libavif-dev"
      macos-deps: "sdl2 glfw glew glm"
      pre-configure-steps: "bash scripts/build_sdl3.sh"
      setup-vulkan: true
      setup-vulkan-linux: false
      setup-vulkan-windows: false
      pre-deps-steps: "bash scripts/downgrade_cmake.sh"

  build-glfw:
    name: Build (GLFW)
    uses: JunaMeinhold/cmake-actions/.github/workflows/cmake.yml@v1.x.x
    with:
      enable-android: false
      lib-name: ImGuiImplGLFW-static
      repo: HexaEngine/cimgui_impl
      # Pinned to the cimgui_impl commit the shipped backend natives were built from (imgui b48d1af, as in cimgui).
      repo-tag: d31eabc9f71904d6d52448ef1f618e761c3bbceb
      # Single-config generators (Linux, macOS, Android) otherwise compile at -O0; MSVC Release uses /O2.
      cmake-flags: -DCMAKE_BUILD_TYPE=Release -DBACKENDS_GLFW_ONLY=ON -DIMGUI_WCHAR32=ON -DBUILD_SHARED_LIBS=OFF
      cmake-flags-linux: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-macos: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-android: -DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG"
      cmake-flags-windows: -DCMAKE_SYSTEM_VERSION=10.0.26100.0
      bin-name-osx: libImGuiImplGLFW.a
      bin-name-linux: libImGuiImplGLFW.a
      bin-name-android: libImGuiImplGLFW.a
      bin-name-windows: Release/ImGuiImplGLFW.lib
      bin-name-osx-normalized: ImGuiImplGLFW.a
      bin-name-linux-normalized: ImGuiImplGLFW.a
      bin-name-android-normalized: ImGuiImplGLFW.a
      bin-name-windows-normalized: ImGuiImplGLFW.lib
      linux-deps: "build-essential cmake libsdl2-dev libglfw3-dev libglu1-mesa-dev libvulkan-dev patchelf"
      macos-deps: "sdl2 glfw glew glm"
      use-vcpkg: true
      use-vcpkg-linux: false
      vcpkg-packages: "glfw3"
      setup-vulkan: true
      setup-vulkan-linux: false
      setup-vulkan-windows: false
      pre-deps-steps: "bash scripts/downgrade_cmake.sh"
      checkout-self: true
